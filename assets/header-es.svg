<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Arturo Fierro Pardo — Ingeniero de Telecomunicacion, IA aplicada a finanzas">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7"/>
      <stop offset="55%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#E3B341"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#11161F"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="12" fill="none" stroke="#21262D" stroke-width="1"/>

  <!-- acento -->
  <rect x="70" y="58" width="56" height="3" rx="1.5" fill="#2F81F7"/>

  <!-- texto -->
  <text x="70" y="122" fill="#E6EDF3" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="0.5">Arturo Fierro Pardo</text>
  <text x="70" y="158" fill="#9BA7B4" font-family="Helvetica, Arial, sans-serif" font-size="19">Ingeniero de Sistemas de Telecomunicación · IA aplicada a finanzas</text>
  <text x="70" y="196" fill="#6E7681" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="14">madrid · icai — máster en tecnologías financieras</text>

  <!-- motivo: señal que se convierte en serie temporal -->
  <g fill="none" stroke="url(#line)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700,140 C716.7,106 733.3,106 750,140 C766.7,174 783.3,174 800,140 C816.7,106 833.3,106 850,140 C866.7,174 883.3,174 900,140"/>
    <path d="M900,140 L920,128 L940,146 L960,118 L980,130 L1000,98 L1020,110 L1040,78 L1060,88 L1080,60 L1100,72 L1128,46"/>
  </g>

  <!-- nodos -->
  <g fill="#0D1117" stroke="#2F81F7" stroke-width="2">
    <circle cx="700" cy="140" r="4"/>
    <circle cx="900" cy="140" r="4"/>
  </g>
  <circle cx="1128" cy="46" r="5.5" fill="#E3B341"/>
  <circle cx="1128" cy="46" r="11" fill="none" stroke="#E3B341" stroke-opacity="0.28" stroke-width="2"/>

  <!-- retícula tenue -->
  <g stroke="#21262D" stroke-width="1">
    <line x1="700" y1="212" x2="1128" y2="212"/>
    <line x1="700" y1="212" x2="700" y2="206"/>
    <line x1="914" y1="212" x2="914" y2="206"/>
    <line x1="1128" y1="212" x2="1128" y2="206"/>
  </g>
  <text x="700" y="232" fill="#6E7681" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="11">señal</text>
  <text x="1128" y="232" text-anchor="end" fill="#6E7681" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="11">mercado</text>
</svg>
